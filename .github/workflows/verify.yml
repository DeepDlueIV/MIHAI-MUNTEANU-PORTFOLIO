name: Portfolio verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: portfolio-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only; fi
          npm ci
      - name: Keep the generated lock with the source
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'build: lock verified portfolio dependencies'
            git push origin "HEAD:$SOURCE_BRANCH"
          fi
      - run: npm run check && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-verification
          path: |
            qa/
            dist/
            package-lock.json
            test-results/
          retention-days: 7
